<!--
  Exact versions with integrity hashes: the floating @2 tag meant whatever
  jsDelivr served became admin-session-level code, unverified. A tampered or
  swapped response now fails the hash and simply doesn't execute.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"
        integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
        integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
        crossorigin="anonymous"></script>
<script>
'use strict';

// Chart.js brand defaults + a small registry so re-rendering a tab tears down
// old canvases (Chart.js errors if a canvas is reused while still bound).
// Chart colours read the design tokens, so the graphs follow light and dark
// with the rest of the page. Read once at load; the charts are rebuilt on tab
// changes anyway.
const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const AMBER = token('--accent'), SAGE = token('--success-bar'), CLAY = token('--danger'),
      INK2 = token('--text-muted'), LINE = token('--border');
if (window.Chart) {
  Chart.defaults.color = INK2;
  Chart.defaults.font.family = "-apple-system, 'Segoe UI', Roboto, sans-serif";
  Chart.defaults.borderColor = LINE;
  Chart.defaults.plugins.legend.labels.boxWidth = 12;
}
const _charts = {};
function chart(id, config) {
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  if (_charts[id]) _charts[id].destroy();
  _charts[id] = new Chart(el, config);
}
function destroyCharts() { for (const k in _charts) { _charts[k].destroy(); delete _charts[k]; } }
const SUPABASE_URL = 'https://rfbqgglbqmkoikgtjict.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmYnFnZ2xicW1rb2lrZ3RqaWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NDM3MzEsImV4cCI6MjEwMDExOTczMX0.9fwpw6_azij5Z0Iycaz5cwcSikJfaGa7fW1HxigWcw4';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDay = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—';
const fmtWhen = iso => {
  if (!iso) return 'never';
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (h < 1) return 'just now';
  if (h < 24) return Math.round(h) + 'h ago';

/* ------------------------------------------------------------ auth */

async function main() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  return gateOnSecondFactor();
}

/* A magic link proves someone reached the inbox, and nothing more. Everything
   past this point needs a second factor: aal2 or the console stays shut.
   Enrolment lives here because the TOTP APIs are only reachable from a
   signed-in client — there is no button for it in the Supabase dashboard. */
async function gateOnSecondFactor() {
  const { data: aal, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (error) { await sb.auth.signOut(); return renderLogin(); }
  if (aal.currentLevel === 'aal2') { renderShell(); loadTab(); return; }

  const { data: factors, error: listErr } = await sb.auth.mfa.listFactors();
  if (listErr) { await sb.auth.signOut(); return renderLogin(); }
  // listFactors().totp holds verified factors only. A half-finished
  // enrolment is in .all and nowhere else, and renderEnrol has to see it.
  const totp = (factors.all || []).filter(f => f.factor_type === 'totp');
  const verified = totp.find(f => f.status === 'verified');
  return verified ? renderChallenge(verified) : renderEnrol(totp);
}

function authShell(title, sub, body) {
  app().innerHTML = `
    <div id="login" class="card">
      <h1>Argus <span>${title}</span></h1>
      <p class="sub">${sub}</p>
      ${body}
      <div id="msg"></div>
    </div>`;
}

async function renderEnrol(existing) {
  authShell('Two-factor setup',
    'One-time setup: pair an authenticator app before the console opens.',
    '<p class="muted">Preparing your code…</p>');

  // A half-finished attempt leaves an unverified factor behind, and Supabase
  // refuses a fresh enrolment while one is sitting there.
  for (const stale of existing.filter(f => f.status !== 'verified')) {
    await sb.auth.mfa.unenroll({ factorId: stale.id });
  }

  const { data, error } = await sb.auth.mfa.enroll({
    factorType: 'totp',
    friendlyName: `Argus admin ${new Date().toISOString().slice(0, 10)}`,
  });
  if (error) {
    authShell('Two-factor setup', 'Setup could not start.',
      `<p class="err">${esc(error.message)}</p>
       <button class="act" id="signout-alt">Sign out</button>`);
    document.getElementById('signout-alt').onclick = () => sb.auth.signOut();
    return;
  }

  authShell('Two-factor setup',
    'Scan this with Google Authenticator, 1Password, or any TOTP app, then enter the six digits it shows.', `
    <img src="${data.totp.qr_code}" alt="Two-factor setup QR code"
         style="width:200px;height:200px;background:#FFFFFF;border-radius:12px;padding:8px;display:block;margin:0 auto 12px">
    <p class="muted" style="text-align:center;margin-bottom:10px">Can't scan it? Enter this key by hand:<br>
      <span class="mono">${esc(data.totp.secret)}</span></p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6">
    <div style="height:10px"></div>
    <button class="primary" id="verify">Confirm and open the console</button>
    <div style="height:8px"></div>
    <button class="act" id="signout-alt">Sign out</button>`);

  document.getElementById('signout-alt').onclick = () => sb.auth.signOut();
  wireCodeEntry(data.id, 'Setup could not be confirmed — check the code and try again.');
}

function renderChallenge(factor) {
  authShell('Beta Admin', 'Enter the six-digit code from your authenticator app.', `
    <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6">
    <div style="height:10px"></div>
    <button class="primary" id="verify">Verify</button>
    <div style="height:8px"></div>
    <button class="act" id="signout-alt">Sign out</button>`);
  document.getElementById('signout-alt').onclick = () => sb.auth.signOut();
  wireCodeEntry(factor.id,
    'That code was not accepted. Codes change every 30 seconds — try the current one.');
}

/* Enrolment and sign-in are the same shape: challenge a factor, verify a
   code, land back in main() with an aal2 session. */
function wireCodeEntry(factorId, failureMessage) {
  const input = document.getElementById('code');
  const button = document.getElementById('verify');
  const msg = () => document.getElementById('msg');

  const submit = async () => {
    const code = (input.value || '').replace(/\D/g, '');
    if (code.length !== 6) {
      msg().className = 'err'; msg().textContent = 'Enter all six digits.'; return;
    }
    const label = button.textContent;
    button.disabled = true; button.textContent = 'Checking…';
    try {
      const { data: challenge, error: challengeErr } = await sb.auth.mfa.challenge({ factorId });
      if (challengeErr) throw challengeErr;
      const { error: verifyErr } = await sb.auth.mfa.verify({
        factorId, challengeId: challenge.id, code,
      });
      if (verifyErr) throw verifyErr;
      await main();                      // the session is aal2 from here
      return;
    } catch (_) {
      msg().className = 'err';
      msg().textContent = failureMessage;
      input.value = '';
      input.focus();
    }
    button.disabled = false; button.textContent = label;
  };

  button.onclick = submit;
  input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  input.focus();
}

/* Admin actions worth being able to reconstruct later. Append-only table, and
   a logging failure must never block the action itself. */
async function audit(action, detail) {
  try { await sb.from('admin_audit').insert({ action, detail }); } catch (_) { /* non-blocking */ }
}

function renderLogin() {
  authShell('Beta Admin', 'Sign in with your admin email — a magic link lands in your inbox.', `
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <div style="height:10px"></div>
    <button class="primary" id="send">Send magic link</button>`);
  document.getElementById('send').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const msg = document.getElementById('msg');
    if (!email) { msg.className = 'err'; msg.textContent = 'Enter your email.'; return; }
    // shouldCreateUser:false — without it this box provisions an account for
    // any address typed in, and makes the project send mail on demand.
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname },
    });
    // Same answer whether or not the address is known. With signups off,
    // reporting "signups not allowed" would turn this box into an oracle for
    // which addresses are admins. Genuine server faults still surface.
    if (error && error.status >= 500) {
      msg.className = 'err';
      msg.textContent = esc(error.message);
    } else {
      msg.className = 'ok';
      msg.textContent = 'If that address belongs to an admin, a link is on its way.';
    }
  };
}

// The gate runs from main() only. SIGNED_IN also reaches every other open

const view = () => document.getElementById('view');

async function loadTab() {
  view().innerHTML = '<p class="muted">Loading…</p>';
  destroyCharts();
  try {
    const since = new Date(Date.now() - windowDays * 864e5).toISOString().slice(0, 10);
    const wantsBehaviour = BEHAVIOURAL_TABS.has(tab);
    // Retention needs a longer reach than the window picker: a 7-day view
    // still has to know whether someone activated 30 days ago came back.
    const sessionsSince = new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10);
    const none = Promise.resolve({ data: [] });

    const [testers, telemetry, errors, feedback, events, sessions, milestones, requests] = await Promise.all([
      sb.from('testers').select('*, devices(id, os, app_version, last_seen_at)').order('created_at', { ascending: false }),
      sb.from('telemetry_daily').select('*').gte('day', since).order('day'),
      sb.from('error_daily').select('*').gte('day', since),
      tab === 'feedback' ? sb.from('feedback_mirror').select('*').order('created_at', { ascending: false }).limit(200) : none,
      wantsBehaviour ? sb.from('events_daily').select('*').gte('day', since) : none,
      wantsBehaviour ? sb.from('sessions_daily').select('*').gte('day', sessionsSince) : none,
      wantsBehaviour ? sb.from('milestones').select('*') : none,
      tab === 'testers' ? sb.from('invite_requests').select('*').order('created_at', { ascending: false }).limit(200) : none,
    ]);
    for (const r of [testers, telemetry, errors, feedback, events, sessions, milestones, requests]) if (r.error) throw r.error;
    cache = { testers: testers.data, telemetry: telemetry.data, errors: errors.data,
              feedback: feedback.data, events: events.data, sessions: sessions.data,
              milestones: milestones.data, requests: requests.data };
    ({ testers: vTesters, retention: vRetention, activation: vActivation, rhythm: vRhythm,
       people: vPeople, activity: vActivity, usage: vUsage, funnel: vFunnel,
       errors: vErrors, feedback: vFeedback, broadcast: vBroadcast })[tab]();
  } catch (err) {
    view().innerHTML = `<p class="err">${esc(err.message || err)}</p>
      <p class="muted">If you just signed in on a new device, your session may need a refresh.</p>`;
  }
}

function bars(entries, cls = '') {
  const max = Math.max(1, ...entries.map(([, n]) => n));
  return entries.map(([label, n]) =>
    `<div class="bar-row ${cls}"><span class="label" title="${esc(label)}">${esc(label)}</span>
     <div class="bar" style="width:${Math.round(n / max * 60)}%"></div>
     <span class="val">${n}</span></div>`).join('') || '<p class="muted">Nothing yet.</p>';
}

/* ------------------------------------------- behavioural analytics

   These four answer the questions daily counters could not: do people come
   back, where do they stall, when do they work, and who is slipping away.
   Everything below is derived from counts and timestamps — no content. */

const DAY_MS = 864e5;
const iso = (d) => new Date(d).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / DAY_MS);

function activeDaysByTester() {
  const map = new Map();
  for (const s of cache.sessions || []) {
    if (!s.sessions) continue;
    if (!map.has(s.tester_id)) map.set(s.tester_id, new Set());
    map.get(s.tester_id).add(s.day);
  }
  return map;
}

function statRow(stats) {
  return `<div class="grid">${stats.map(([n, l, hint]) =>
    `<div class="stat"><div class="n">${n}</div><div class="l">${esc(l)}</div>
     ${hint ? `<div class="l" style="opacity:.65">${esc(hint)}</div>` : ''}</div>`).join('')}</div>`;
}

function emptyState(what) {
  return `<div class="card"><p class="muted">Nothing here yet — ${esc(what)}
    Testers report once a day, so a fresh signal takes up to 24 hours to show up.</p></div>`;
}

/* ------------------------------------------------------- retention */

function vRetention() {
  const active = activeDaysByTester();
  const today = new Date();
  const activeWithin = (days) => {
    const cutoff = iso(today - days * DAY_MS);
    let n = 0;
    for (const set of active.values()) if ([...set].some(d => d >= cutoff)) n++;
    return n;
  };
  const dau = activeWithin(1), wau = activeWithin(7), mau = activeWithin(30);
  const sticky = mau ? Math.round(dau / mau * 100) : 0;

  // Cohort by activation week, measured in whole days since activation.
  const OFFSETS = [0, 1, 3, 7, 14, 30];
  const cohorts = new Map();
  for (const t of cache.testers) {
    if (!t.activated_at) continue;
    const activated = iso(t.activated_at);
    const monday = iso(new Date(activated).getTime()
      - ((new Date(activated).getUTCDay() + 6) % 7) * DAY_MS);
    if (!cohorts.has(monday)) cohorts.set(monday, []);
    cohorts.get(monday).push({ id: t.id, activated });
  }

  const rows = [...cohorts.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([week, members]) => {
    const cells = OFFSETS.map(off => {
      // Only count members who have had time to reach this offset, otherwise
      // a cohort activated yesterday shows 0% at D30 and reads as churn.
      const eligible = members.filter(m => daysBetween(m.activated, today) >= off);
      if (!eligible.length) return { label: '·', pct: null };
      const retained = eligible.filter(m => {
        const set = active.get(m.id);
        if (!set) return false;
        const target = iso(new Date(m.activated).getTime() + off * DAY_MS);
        return off === 0 ? set.has(target) : [...set].some(d => d >= target);
      }).length;
      const pct = Math.round(retained / eligible.length * 100);
      return { label: pct + '%', pct };
    });
    return { week, size: members.length, cells };
  });

  if (!rows.length) return view().innerHTML = emptyState('no tester has activated yet.');

  const shade = (pct) => pct === null ? 'transparent'
    : `color-mix(in srgb, ${SAGE} ${Math.max(8, pct)}%, transparent)`;

  view().innerHTML = `
    ${statRow([[dau, 'Active today'], [wau, 'Active this week'],
               [mau, 'Active this month'], [sticky + '%', 'Stickiness', 'daily ÷ monthly']])}
    <div class="card">
      <h2>Do they come back?</h2>
      <p class="muted" style="margin-bottom:12px">Share of each activation cohort still
        active N days later. A dot means that cohort hasn't reached that age yet.</p>
      <div class="scroll"><table>
        <thead><tr><th>Activated week of</th><th>Size</th>
          ${OFFSETS.map(o => `<th>D${o}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td>${fmtDay(r.week)}</td><td class="mono">${r.size}</td>
          ${r.cells.map(c => `<td style="background:${shade(c.pct)}">${c.label}</td>`).join('')}
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

const FUNNEL_STEPS = [
  ['activated', 'Activated'], ['first_capture', 'Captured something'],
  ['first_cv', 'Uploaded a CV'], ['first_match', 'Matched a CV'],
  ['first_draft', 'Drafted an application'], ['first_applied', 'Marked applied'],
];

function vActivation() {
  const byTester = new Map();
  for (const m of cache.milestones || []) {
    if (!byTester.has(m.tester_id)) byTester.set(m.tester_id, {});
    byTester.get(m.tester_id)[m.milestone] = m.reached_at;
  }
  const activated = cache.testers.filter(t => t.activated_at);
  for (const t of activated) {
    if (!byTester.has(t.id)) byTester.set(t.id, {});
    byTester.get(t.id).activated = t.activated_at;
  }

  const steps = FUNNEL_STEPS.map(([key, label]) => {
    const reached = [...byTester.values()].filter(v => v[key]);
    return { key, label, n: reached.length };
  });
  if (!steps[0].n) return view().innerHTML = emptyState('no tester has activated yet.');

  const top = steps[0].n;
  const median = (nums) => {
    if (!nums.length) return null;
    const s = [...nums].sort((a, b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
  };

  view().innerHTML = `
    <div class="card">
      <h2>Where do they stall?</h2>
      <p class="muted" style="margin-bottom:14px">Every activated tester enters at the top.
        The drop between two steps is where the product is losing people.</p>
      ${steps.map((s, i) => {
        const prev = i ? steps[i - 1].n : null;
        const dropped = prev === null ? 0 : prev - s.n;
        const gaps = i === 0 ? [] : [...byTester.values()]
          .filter(v => v[steps[i - 1].key] && v[s.key])
          .map(v => daysBetween(v[steps[i - 1].key], v[s.key]));
        const med = median(gaps);
        return `<div class="bar-row ${s.n && prev !== null && dropped / prev > 0.5 ? '' : 'g'}">
          <span class="label">${esc(s.label)}</span>
          <div class="bar" style="width:${Math.round(s.n / top * 60)}%"></div>
          <span class="val">${s.n}</span>
          <span class="muted" style="margin-left:8px">
            ${prev === null ? `of ${top}`
              : `${Math.round(s.n / prev * 100)}% of previous${dropped ? ` · ${dropped} dropped` : ''}`}
            ${med !== null ? ` · median ${med === 0 ? 'same day' : med + 'd'}` : ''}
          </span>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <h2>Time to first value</h2>
      <p class="muted">${(() => {
        const times = [...byTester.values()].filter(v => v.activated && v.first_capture)
          .map(v => daysBetween(v.activated, v.first_capture));
        const m = median(times);
        return times.length
          ? `Median ${m === 0 ? 'same day' : m + ' day' + (m === 1 ? '' : 's')} from
             activation to first capture, across ${times.length} tester${times.length === 1 ? '' : 's'}.`
          : 'No tester has captured anything yet.';
      })()}</p>
    </div>`;
}

function vRhythm() {
  const events = cache.events || [];

  const WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
  let peak = 0;
  for (const e of events) {
    const weekday = (new Date(e.day + 'T00:00:00Z').getUTCDay() + 6) % 7;
    grid[weekday][e.hour] += e.count;

    return `${String(top).padStart(2, '0')}:00`;

  view().innerHTML = `

const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L
// Rejection sampling: 256 % 31 != 0, so a plain modulo would make the first
// eight letters roughly 4% likelier than the rest. Cheap to do properly.
const rnd = (n) => {
  const limit = 256 - (256 % ALPHABET.length);
  let out = '';
  while (out.length < n) {
    for (const b of crypto.getRandomValues(new Uint8Array(n * 2))) {
      if (b < limit) { out += ALPHABET[b % ALPHABET.length]; if (out.length === n) break; }
    }
  }
  return out;
};
// SEC-05: eight random characters, not six — 31^8 (~8.5e11) against 31^6
// (~8.9e8). Paired with the per-IP failure budget on activate, guessing one
// stops being worth attempting. Older ARGUS-XXXX-XX codes still work; the
// function matches whatever is stored against the tester.
const newCode = () => `ARGUS-${rnd(4)}-${rnd(4)}`;

// Kept in step with inviteText() in supabase/functions/request-invite: no
// security-warning walkthrough in the mail (it read as phishing), one link.
function inviteMessage(code, name) {
  return `Hi ${name || 'there'},\n\nThanks for asking about Argus. You're in.\n\nYour personal access code is:\n${code}\n\nYou can get the app for Mac or Windows here, with a short note on opening it the first time:\nhttps://teofilusshaduka.github.io/opportunity-tracker-releases/#get\n\nOpen Argus, enter the code, and it walks you through the rest. The code is tied to you, so please keep it to yourself.\n\nIf anything breaks or confuses you, just reply to this email. I read every one.\n\nTeo`;
}

/* Site requests answer themselves through the request-invite edge function:
   it mints a code and mails it. This card is the record of that, plus the one
   lever left — draining whatever the daily mail cap held back. */
function requestsCard() {
  const r = cache.requests || [];
  const day = new Date(Date.now() - 864e5).toISOString();
  const today = r.filter(x => x.created_at >= day);
  const waiting = r.filter(x => x.status === 'queued' || x.status === 'failed');
  const pill = { sent: 'active', resent: 'active', queued: 'invited', failed: 'revoked', ignored: 'revoked' };
  return `<div class="card scroll">
      <h2>Requests from the site</h2>
      <p class="muted" style="margin-bottom:10px">Answered automatically: ${today.length} in the last 24 h,
        ${today.filter(x => x.status === 'sent' || x.status === 'resent').length} sent.
        ${waiting.length ? `<strong>${waiting.length} waiting</strong> (daily mail cap or a failed send).` : 'Nothing waiting.'}</p>
      ${waiting.length ? `<button class="primary" id="req-drain">Send queued (${waiting.length})</button>
      <div id="req-out"></div>` : ''}
      <table><thead><tr><th>Requested by</th><th>Note</th><th>Status</th><th>When</th></tr></thead>
      <tbody>${r.slice(0, 50).map(x => `<tr>
        <td><strong>${esc(x.full_name || '—')}</strong><br><span class="muted">${esc(x.email)}</span></td>
        <td class="muted">${esc(x.message || '')}</td>
        <td><span class="pill ${pill[x.status] || ''}">${x.status}</span>${x.error ? `<br><span class="muted">${esc(x.error)}</span>` : ''}</td>
        <td class="muted">${fmtWhen(x.created_at)}</td></tr>`).join('')
        || '<tr><td colspan="4" class="muted">No requests yet.</td></tr>'}</tbody></table>
    </div>`;
}

function bindRequestsCard() {
  const btn = document.getElementById('req-drain');
  if (!btn) return;
  btn.onclick = async () => {
    const out = document.getElementById('req-out');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const { data: { session } } = await sb.auth.getSession();
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/request-invite`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON_KEY,
                   Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ action: 'drain' }),
      });
      const j = await resp.json().catch(() => ({}));
      if (!resp.ok || !j.success) throw new Error(j.error || `HTTP ${resp.status}`);
      out.innerHTML = `<p class="ok">Sent ${j.sent + j.resent}, failed ${j.failed}, still waiting ${j.left}` +
        (j.room === 0 ? ' — today’s mail cap is used up; try again tomorrow.' : '.') + '</p>';
      setTimeout(loadTab, 1500);
    } catch (err) {
      out.innerHTML = `<p class="err">${esc(err.message || err)}</p>`;
      btn.disabled = false; btn.textContent = 'Send queued';
    }
  };
}

    type: 'bar',
    data: { labels: feats.map(([k]) => COUNTER_LABELS[k] || k), datasets: [{
      data: feats.map(([, n]) => n), backgroundColor: AMBER, borderRadius: 5, barThickness: 22 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: LINE } },
                y: { grid: { display: false } } } },
  });
  const days = Object.keys(perDay).sort();
  chart('c-usage-trend', {
    type: 'bar',
    data: { labels: days.map(fmtDay), datasets: [{
      data: days.map(d => perDay[d]), backgroundColor: 'rgba(143,168,118,.7)', borderRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: LINE } },
                x: { grid: { display: false } } } },
  });
}

/* ---------------------------------------------------------- funnel */

const FUNNEL_ORDER = ['inbox', 'pending', 'applied', 'interview', 'offer', 'rejected', 'expired'];

function vFunnel() {
  const latest = {};
  cache.telemetry.forEach(r => {
    if (r.funnel && (!latest[r.tester_id] || r.day > latest[r.tester_id].day)) latest[r.tester_id] = r;
  });
  const sums = {};
  Object.values(latest).forEach(r => Object.entries(r.funnel).forEach(([k, n]) => sums[k] = (sums[k] || 0) + n));
  const applied = (sums.applied || 0) + (sums.interview || 0) + (sums.offer || 0);
  view().innerHTML = `
    <div class="grid">
      <div class="stat"><div class="n">${Object.values(sums).reduce((a, b) => a + b, 0)}</div><div class="l">opportunities tracked</div></div>
      <div class="stat"><div class="n">${applied}</div><div class="l">reached applied+</div></div>
      <div class="stat"><div class="n">${sums.offer || 0}</div><div class="l">offers</div></div>
    </div>
    <div class="card"><h2>Pipeline across all testers (latest snapshot each)</h2>
      <div class="chartbox"><canvas id="c-funnel"></canvas></div></div>
    <p class="muted">Counts only — the contents of testers' pipelines are never collected.</p>`;

  const stages = FUNNEL_ORDER.filter(k => sums[k] !== undefined);
  const palette = { inbox: INK2, pending: token('--warning-bar'), applied: AMBER,
                    interview: token('--accent-hover'), offer: SAGE, rejected: CLAY,
                    expired: token('--control-border') };
  chart('c-funnel', {
    type: 'bar',
    data: { labels: stages.map(s => s[0].toUpperCase() + s.slice(1)), datasets: [{
      data: stages.map(s => sums[s] || 0),
      backgroundColor: stages.map(s => palette[s] || AMBER), borderRadius: 6, barThickness: 40 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: LINE } },
                x: { grid: { display: false } } } },
  });
}

/* ---------------------------------------------------------- errors */

function vErrors() {
  const byFp = {};
  cache.errors.forEach(r => {
    const e = byFp[r.fingerprint] || (byFp[r.fingerprint] = { count: 0, testers: new Set(), versions: new Set() });
    e.count += r.count;
    e.testers.add(r.tester_id);
    if (r.app_version) e.versions.add('v' + r.app_version);
  });
  const rows = Object.entries(byFp).sort((a, b) => b[1].count - a[1].count);
  view().innerHTML = `
    <div class="card scroll"><h2>Crash fingerprints (${windowDays}d) ${windowPicker()}</h2>
      ${rows.length ? `<table><thead><tr><th>Fingerprint</th><th>Count</th><th>Testers</th><th>Versions</th></tr></thead>
      <tbody>${rows.map(([fp, e]) => `<tr><td class="mono">${esc(fp)}</td><td>${e.count}</td>
        <td>${e.testers.size}</td><td class="muted">${[...e.versions].join(', ') || '—'}</td></tr>`).join('')}</tbody></table>`
      : '<p class="muted">No errors reported. Suspiciously calm.</p>'}</div>`;
  bindWindowPicker();
}

/* -------------------------------------------------------- feedback */

function vFeedback() {
  const names = {};
  cache.testers.forEach(t => names[t.id] = t.full_name || t.email || t.invite_code);
  view().innerHTML = `
    <div class="card"><h2>Feedback (text mirror — screenshots arrive by email)</h2>
      ${cache.feedback.length ? cache.feedback.map(f => `
        <div style="border-bottom:1px solid var(--line);padding:10px 0">
          <div class="muted">${esc(f.category || 'Feedback')} · ${esc(names[f.tester_id] || 'unknown')} ·
            ${fmtWhen(f.created_at)} ${f.app_version ? '· v' + esc(f.app_version) : ''}</div>
          <div>${esc(f.message)}</div>
        </div>`).join('') : '<p class="muted">No feedback mirrored yet.</p>'}</div>`;
}

/* -------------------------------------------------------- broadcast */

let bcAudience = 'active';

function vBroadcast() {
  const withEmail = cache.testers.filter(t => t.email);
  const counts = { active: withEmail.filter(t => t.status === 'active').length, all: withEmail.length };
  view().innerHTML = `
    <div class="card"><h2>Email your testers</h2>
      <div class="seg" id="bc-aud">
        <button data-a="active" class="${bcAudience === 'active' ? 'on' : ''}">Active (${counts.active})</button>
        <button data-a="all" class="${bcAudience === 'all' ? 'on' : ''}">Everyone with an email (${counts.all})</button>
      </div>
      <div class="row"><input id="bc-subject" placeholder="Subject" maxlength="200"></div>
      <textarea id="bc-body" rows="10" placeholder="Write in plain text — a blank line starts a new paragraph.&#10;{{NAME}} becomes each tester's first name."></textarea>
      <p class="muted">Sent one by one from principiaworks@gmail.com, wrapped in the Argus house style
        (header and footer added automatically). Replies land in that inbox.</p>
      <div style="height:8px"></div>
      <button class="primary" id="bc-send">Send</button>
      <div id="bc-out"></div>
    </div>`;

  document.querySelectorAll('#bc-aud button').forEach(b => b.onclick = () => {
    bcAudience = b.dataset.a;
    document.querySelectorAll('#bc-aud button').forEach(x => x.classList.toggle('on', x === b));
  });

  document.getElementById('bc-send').onclick = async () => {
    const subject = document.getElementById('bc-subject').value.trim();
    const text = document.getElementById('bc-body').value.trim();
    const out = document.getElementById('bc-out');
    const n = counts[bcAudience];
    if (!subject || !text) { out.innerHTML = '<p class="err">Subject and message are both needed.</p>'; return; }
    if (!n) { out.innerHTML = '<p class="err">No recipients in that group have an email address.</p>'; return; }
    if (!confirm(`Send "${subject}" to ${n} tester${n === 1 ? '' : 's'}?`)) return;
    const btn = document.getElementById('bc-send');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const { data: { session } } = await sb.auth.getSession();
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/broadcast`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON_KEY,
                   Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ audience: bcAudience, subject, text }),
      });
      const result = await resp.json().catch(() => ({}));
      if (resp.ok && result.success) {
        audit('broadcast_sent', { audience: bcAudience, subject, recipients: result.sent });
        const failed = (result.failed || []).length;
        out.innerHTML = `<p class="ok">Sent to ${result.sent} tester${result.sent === 1 ? '' : 's'}.` +
          (failed ? ` <span class="err">${failed} failed: ${esc(result.failed.join(', '))}</span>` : '') + '</p>';
        document.getElementById('bc-subject').value = '';
        document.getElementById('bc-body').value = '';
      } else {
        out.innerHTML = `<p class="err">${esc(result.error || `HTTP ${resp.status}`)}</p>`;
      }
    } catch (err) {
      out.innerHTML = `<p class="err">${esc(err.message || err)}</p>`;
    }
    btn.disabled = false; btn.textContent = 'Send';
  };
}

main();
</script>
</body>
</html>
